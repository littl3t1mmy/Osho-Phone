      0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
      0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152,
      0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138,
      0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70,
      0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5,
      0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa,
      0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);
    const H = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
    const len = bytes.length, total = Math.ceil((len + 9) / 64) * 64;
    const m = new Uint8Array(total);
    m.set(bytes); m[len] = 0x80;
    const bits = len * 8;
    for (let i = 0; i < 8; i++) m[total - 1 - i] = Math.floor(bits / Math.pow(2, 8 * i)) & 0xff;
    const W = new Uint32Array(64);
    const r = (x, n) => (x >>> n) | (x << (32 - n));
    for (let off = 0; off < total; off += 64) {
      for (let i = 0; i < 16; i++) W[i] = (m[off + 4 * i] << 24) | (m[off + 4 * i + 1] << 16) | (m[off + 4 * i + 2] << 8) | m[off + 4 * i + 3];
      for (let i = 16; i < 64; i++) {
        const s0 = r(W[i - 15], 7) ^ r(W[i - 15], 18) ^ (W[i - 15] >>> 3), s1 = r(W[i - 2], 17) ^ r(W[i - 2], 19) ^ (W[i - 2] >>> 10);
        W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) >>> 0;
        const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += h;
    }
    return Array.from(H, (x) => x.toString(16).padStart(8, "0")).join("");
  }

  /* A message's fingerprint exactly as tools/relay/relay.py message_sha() takes it, so a stamp added later never
     makes a message read as changed. B-1513: first, the stamp inbox/log.py's mark_source() puts below the top (a blank
     line, then exactly [ingested as B-NNNN], stacked ones too) is dropped from right after the first Date: / STATUS:
     line or a line-0 # heading, where its loop puts it; anything else there is content. Then leading blank lines and
     agents' [ingested as ...] / [answered in ...] stamps are skipped, the rest hashed as is. Python's own strip(), \d
     and \b, not trim()'s: trim() also drops a BOM and Python's doesn't, so a BOM line read differently (Codex,
     20261009-230820; drill_app W2b checks both sides agree). */
  const PY_SPACE = "\\t\\n\\v\\f\\r\\x1c-\\x1f \\x85\\xa0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000";
  const PY_STRIP = new RegExp(`^[${PY_SPACE}]+|[${PY_SPACE}]+$`, "gu");
  const STAMP_RE = /^\[(ingested as|answered in) [BG]-\p{Nd}+(?![\p{L}\p{N}_])[^\]]*\]/u;
  const LOG_STAMP_RE = /^\[ingested as B-[0-9]{4,}\]$/;
  function messageSha(text) {
    const lines = text.split("\n");
    const k = lines.findIndex((ln, n) => ln.startsWith("Date:") || ln.startsWith("STATUS:") || (n === 0 && ln.startsWith("#")));
    if (k >= 0) while (k + 2 < lines.length && lines[k + 1] === "" && LOG_STAMP_RE.test(lines[k + 2])) lines.splice(k + 1, 2);
    const strip = (s) => s.replace(PY_STRIP, "");
    let i = 0;
    while (i < lines.length && (!strip(lines[i]) || STAMP_RE.test(strip(lines[i])))) i++;
    return sha256Hex(lines.slice(i).join("\n"));
  }

  /* A seen receipt in relay.py's format (seen() writes the same), for the person recording their own seeing: it
     names the message, its fingerprint, and the replies they were actually shown with theirs. */
  function isoLocal(d) {
    const p = (n) => String(n).padStart(2, "0");
    const off = -d.getTimezoneOffset(), sign = off >= 0 ? "+" : "-", a = Math.abs(off);
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` +
      `${sign}${p(Math.floor(a / 60))}:${p(a % 60)}`;
  }
  function receipt(person, name, msgSha, replies, now, rand) {
    if (!/^[a-z]+$/.test(person) || !/^[A-Za-z0-9._ -]+\.md$/.test(name) || !/^[0-9a-f]{64}$/.test(msgSha))
      throw new AppError("Can't record that as seen", name);
    const reps = Object.keys(replies).sort().map((e) => {
      if (!/^B-\d{4}$/.test(e) || !/^[0-9a-f]{64}$/.test(replies[e])) throw new AppError("A reply's fingerprint is malformed", e);
      return `${e}=${replies[e]}`;
    }).join(",") || "none";
    const p = (n) => String(n).padStart(2, "0");
    const stamp = `${now.getFullYear()}${p(now.getMonth() + 1)}${p(now.getDate())}-${p(now.getHours())}${p(now.getMinutes())}${p(now.getSeconds())}-${rand}`;
    return {
      path: `inbox/seen/${name.replace(/\.md$/, "").slice(0, 60)}--seen-${stamp}.md`,
      text: `by: ${person}\nrecorded_by: ${person}\nat: ${isoLocal(now)}\nscope: named\non_his_word: \n\n` +
            `seen: ${name}\nmessage_sha: ${msgSha}\nreplies: ${reps}\n`,
    };
  }

  /* A message written from the phone: to Fable (Caleb's inbox) or Zeus (Zeus's lane). A request like any other,
     never a release (WORKING-AGREEMENTS 1). The name carries no words from the text. */
  /* The shapes tools/audit/credential_scan.py looks for, same names, same patterns (the drill checks they match). A
     write from the phone goes through GitHub's API, so no commit hook ever sees it: this is the check it gets
     instead (Codex, 20261009-090408). */
  const TOKEN_PATTERNS = [
    ["GitHub fine-grained PAT", /github_pat_[A-Za-z0-9_]{20,}/],
    ["GitHub classic PAT", /ghp_[A-Za-z0-9]{30,}/],
    ["GitHub OAuth/app token", /gh[osur]_[A-Za-z0-9]{30,}/],
    ["sk- key (OpenAI / Moonshot / other)", /(?<![A-Za-z0-9-])sk-[A-Za-z0-9]{20,}/],
    ["Anthropic key", /(?<![A-Za-z0-9-])sk-ant-[A-Za-z0-9]{4,}-[A-Za-z0-9]{20,}/],
    ["AWS access key id", /AKIA[0-9A-Z]{16}/],
    ["Google API key", /AIza[0-9A-Za-z_-]{35}/],
    ["Slack token", /xox[baprs]-[0-9A-Za-z-]{10,}/],
    ["xAI key", /(?<![A-Za-z0-9-])xai-[A-Za-z0-9]{20,}/],
    ["private key block", /-----BEGIN [A-Z ]*PRIVATE KEY-----/],
  ];
  function looksLikeKey(text) {
    const hit = TOKEN_PATTERNS.find(([, re]) => re.test(text));
    return hit ? hit[0] : null;
  }

  /* Stage 3: what the sender means by a message, chosen on the composer (DESIGN.md: Message is the default, Sketch and
     Instruction explicit; open question 9). It travels as one `intent:` header line. An instruction states what Caleb
     wants; it never approves anything (B8): a go is still typed in session. */
  const INTENTS = {
    message: { word: "Message", means: "An ordinary message." },
    sketch: { word: "Sketch", means: "A loose idea: the shape, not a spec. Nothing is built from it as written." },
    instruction: { word: "Instruction", means: "What you want done. It states intent; it never approves anything. A go is still typed in session." },
  };
  /* The same meaning in the message itself, for an agent that reads only the body (Codex, 20261009-200350). It
     explains; it enforces nothing, and it authenticates nobody. */
  const INTENT_NOTICE = {
    sketch: "(Sketch, sent from Caleb's phone: the shape of an idea, not a spec.)",
    instruction: "(Instruction, sent from Caleb's phone: it states work he wants; it is not approval to execute. A go is typed in session.)",
  };
  /* A line that starts like an inbox stamp would make the inbox count the message as already answered: both counters
     read a stamp at the start of any of a message's first 8 lines (inbox/check-uningested.sh, relay.caleb_processed).
     Refused anywhere in the body, visibly, with the draft kept (Codex, 20261009-200350). */
  const STAMP_LINE = /^\s*\[\s*(ingested as|answered in)\b/im;
  function phoneMessage(to, re, body, now, rand, intent) {
    const want = intent === undefined ? "message" : intent;
    if (!Object.prototype.hasOwnProperty.call(INTENTS, want)) throw new AppError("Unknown kind of message", String(want));
    const text = String(body || "").replace(/\r\n/g, "\n").trim();
    if (!text) throw new AppError("The message is empty", "write something first");
    const key = looksLikeKey(text);
    if (key) throw new AppError("That looks like a key or password", `it matches the shape of a ${key}. Take it out: ` +
      "anything sent stays in the repo's history for good");
    if (text.length > 8000) throw new AppError("The message is too long", "keep it under 8,000 characters");
    if (STAMP_LINE.test(text)) throw new AppError("A line starts like an inbox stamp", "a line beginning “[ingested as” or " +
      "“[answered in” would make the inbox treat this as already answered. Reword that line; your text is kept");
    if (!["fable", "zeus"].includes(to)) throw new AppError("Unknown recipient", to);
    const cleanRe = String(re || "none").replace(/[\r\n]+/g, " ").slice(0, 200);
    const p = (n) => String(n).padStart(2, "0");
    const day = `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}`;
    const tm = `${p(now.getHours())}${p(now.getMinutes())}${p(now.getSeconds())}`;
    const dir = to === "zeus" ? "inbox/lanes/zeus/messages" : "inbox/messages";
    return { path: `${dir}/${day}-phone-${tm}-${rand}.md`,
             text: `from: Caleb (phone)\nto: ${to === "zeus" ? "Zeus" : "Fable"}\nre: ${cleanRe}\nintent: ${want}\n\n`
               + (INTENT_NOTICE[want] ? `${INTENT_NOTICE[want]}\n\n` : "") + `${text}\n` };
  }

  /* Does a receipt this phone just wrote still cover the thread as the index now shows it? Only if it pinned the
     same message fingerprint (the index's sha is relay.message_sha) and every reply the index lists. A reply left
     unopened, a message that changed, or a new reply means it's still unread (Codex, 20261009-085407). */
  function locallySeen(t, rec) {
    if (!rec || rec.msgSha !== t.sha) return false;
    return (t.replies || []).every((r) => rec.replies && rec.replies[r.number]);
  }

  /* Whose key it is, by GitHub's numeric account id (it can't be renamed, unlike a login). Anyone else is refused. */
  const PEOPLE_BY_GITHUB_ID = { 329741736: "caleb", 335827109: "garrett" };
  const WRITERS = ["caleb"];         // Garrett's phone writes wait (B4: revisit before Garrett's phone writes)

  /* B-1455: a ledger entry for reading: its first line (the header) apart, the body without the receipt block. */
  function entryBody(text) {
    const lines = text.replace(/\r\n/g, "\n").split("\n");
    return { header: lines[0] || "", body: lines.slice(1).join("\n").split("\n```receipt")[0].trim() };
  }

  /* Words for an entry's status. READY means it asked something when it was written; whether it's still open is
     inbox/WAITING.md's job, so the app never says "open". */
  function statusWord(s) {
    return { READY: "Asked you when written", ACTIONED: "Done", READ: "Read", NEW: "New", QUEUED: "Queued" }[s] || s || "?";
  }

  /* "phone-app-first-four-steps-say-go" -> "phone app first four steps say go" */
  function slugWords(s) { return String(s || "").replace(/[-_]+/g, " ").trim(); }

  /* ---- Stage 2 (B-1476): the rest of the screens. Pure, so the drill can test them. ---- */

  /* Today's two lists from the desk: blockers (items marked blocking) and everything waiting on you, OLDEST first
     (DESIGN.md), each with its minutes and one line of why. An item with no date sorts last, never first. */
  function todayLists(idx) {
    const desk = (idx.desk || []).slice();
    const t = (d) => { const v = Date.parse(d.added || ""); return isNaN(v) ? Infinity : v; };
    desk.sort((a, b) => t(a) - t(b) || String(a.slug || a.title).localeCompare(String(b.slug || b.title)));
    const minutes = desk.reduce((s, d) => s + (Number.isFinite(d.minutes) ? d.minutes : 0), 0);
    return { blockers: desk.filter((d) => d.blocking === true), waiting: desk, minutes };
  }

  const NAMES = { caleb: "Caleb", garrett: "Garrett", fable: "Fable", onyx: "Onyx", zeus: "Zeus" };
  const KIND_WORDS = ["question", "decision", "fyi", "reply"];
  /* A conversation's labels, in words. Who -> whom is display only (for free text it's the message's own From:/To:
     lines, as written): it never decides "waiting for you", routing or seen state (Codex, 20261009-193507). */
  function convo(t, person) {
    const nm = (v) => v ? (NAMES[String(v).toLowerCase()] || String(v)) : null;
    const from = nm(t.sender || t.from), to = nm(t.recipient || (Array.isArray(t.to) ? t.to.join(", ") : t.to));
    const agent = person === "garrett" ? "Onyx" : "Fable";
    return {
      who: from || to ? `${from || "?"} → ${to || "?"}` : null,
      kinds: [t.kind === "direct" ? "direct" : null, KIND_WORDS.includes(t.purpose) ? t.purpose : null].filter(Boolean),
      // Stage 3: only the two that change how a message is read get a chip; a plain Message needs none. Null intent
      // (free text, older phone messages) shows nothing, never a guess.
      intent: t.intent === "sketch" || t.intent === "instruction" ? INTENTS[t.intent].word : null,
      waiting: t.asks_you === true && !t.processed_by,
      replyNote: t.unseen_reason === "new reply" ? `${agent} replied · you haven't seen this reply` : null,
    };
  }
  function isDirect(t) { return t.kind === "direct"; }

  /* The ledger as a timeline: newest day first, then each day's entries by project, newest first within. Rows with
     several tags appear under their first; untagged ones under "Other". `who` filters by series (B Fable, Z Zeus,
     G Onyx); `project` by tag. */
  function whoOf(number) { return { B: "fable", Z: "zeus", G: "onyx" }[String(number || "").charAt(0)] || "?"; }
  function ledgerTimeline(rows, opts) {
    const o = opts || {};
    const keep = rows.filter((e) => (!o.who || o.who === "all" || whoOf(e.number) === o.who)
      && (!o.project || o.project === "all" || (e.projects || []).includes(o.project)));
    const days = new Map();
    for (const e of keep.slice().sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")) || String(b.number).localeCompare(String(a.number)))) {
      const day = String(e.at || "").slice(0, 10) || "undated";
      if (!days.has(day)) days.set(day, new Map());
      const proj = (e.projects && e.projects[0]) || "Other";
      const g = days.get(day);
      if (!g.has(proj)) g.set(proj, []);
      g.get(proj).push(e);
    }
    return [...days.entries()].map(([day, g]) => ({ day, projects: [...g.entries()].map(([project, items]) => ({ project, items })) }));
  }

  function stamp(now) {
    const p = (n) => String(n).padStart(2, "0");
    return `${now.getFullYear()}${p(now.getMonth() + 1)}${p(now.getDate())}-${p(now.getHours())}${p(now.getMinutes())}${p(now.getSeconds())}`;
  }
  /* "Got it" on an alert: an alert-ack/v1 event naming it. It acknowledges the alert only (DESIGN.md seen rules). */
  function alertAck(person, alert, now, rand) {
    if (!/^[a-z]+$/.test(person) || !alert || !/^[A-Za-z0-9-]{1,60}$/.test(alert.alert_id || "") || !/^[0-9a-f]{12}$/.test(rand))
      throw new AppError("Can't record that", "the alert is malformed");
    return { path: `inbox/alerts/${alert.alert_id}--ack-${stamp(now)}-${rand}.md`,
             text: `schema: alert-ack/v1\nalert_id: ${alert.alert_id}\nby: ${person}\nat: ${isoLocal(now)}\n\n` };
  }
  /* "Caught up" on a project: a caught-up/v1 checkpoint naming the person, the project, the newest entry actually
     shown and the commit it was shown from (DATA.md; Codex, 20261009-193507). The index takes the newest checkpoint,
     so a late, older tap can't move it backwards. */
  function caughtUpEvent(person, project, through, shownCommit, now, rand) {
    if (!/^[a-z]+$/.test(person) || !/^[a-z0-9-]{1,60}$/.test(project || "") || !/^[BG]-\d{4}$/.test(through || "")
        || !/^[0-9a-f]{40}$/.test(shownCommit || "") || !/^[0-9a-f]{12}$/.test(rand))
      throw new AppError("Can't record that", "the checkpoint is malformed");
    return { path: `inbox/caught-up/${project}--caught-up-${stamp(now)}-${rand}.md`,
             text: `schema: caught-up/v1\nproject: ${project}\nthrough: ${through}\nby: ${person}\nshown_commit: ${shownCommit}\nat: ${isoLocal(now)}\n\n` };
  }

  /* B-1483/B-1485: one write from the phone, start to finish, so every write fails the same way. `make` returns the
     event to write (the caller decides whether a pending one is reused); it runs inside, so a refusal while building is
     a failure too, and nothing is sent. Only GitHub's explicit yes for this exact path counts as written. An uncertain
     drop keeps this same event for an exact retry; no other failure touches `pending`. It records nothing: the caller
     records (acked, caught up, cleared the box) only when this says ok. */
  async function runWrite(source, pending, pkey, make) {
    let ev = null, sent = false;
    try {
      ev = make();
      sent = true;
      const r = await source.create(ev.path, ev.text, ev.message);
      if (!r || r.created !== true || r.path !== ev.path) {
        // An answer without GitHub's yes doesn't prove nothing landed: keep this exact event, so a retry can't make a
        // second file (Codex, 20261009-204322).
        const err = new AppError("GitHub didn't confirm the write", "it isn't counted as recorded; tapping again resends the same file");
        err.pending = true;
        throw err;
      }
      delete pending[pkey];
      return { ok: true, ev };
    } catch (e) {
      const uncertain = sent && e !== null && typeof e === "object" && !!e.pending;
      if (uncertain) pending[pkey] = ev;
      const error = e instanceof AppError ? e
        : new AppError("The write failed", String((e !== null && typeof e === "object" && e.message) || e));
      return { ok: false, error, pending: !!pending[pkey] };
    }
  }

  /* The writer is the person whose view and index this is, and the key's own person (GitHub mode already forces the
     view to the key; this doesn't rely on that). Shared by Got it and Caught up. */
  function checkWriter(idx, viewPerson, keyPerson) {
    if (!idx || !viewPerson || viewPerson !== keyPerson || idx.person !== viewPerson)
      throw new AppError("Can't record that from this view", "only the key's own person can write here");
  }
  /* B-1483: "Got it" only for an open alert addressed to this person, in the index that drew the strip. The index lists
     only open, unacknowledged alerts to its person, and each says whom it's to; an index from before that says so
     refuses rather than guesses. */
  function checkAlertAck(idx, viewPerson, keyPerson, alertId, shownIdx) {
    if (shownIdx !== undefined && shownIdx !== idx)
      throw new AppError("The page refreshed since you saw this", "tap Got it again on what's showing now");
    checkWriter(idx, viewPerson, keyPerson);
    const a = (idx.alerts || []).find((x) => x && x.alert_id === alertId);
    if (!a) throw new AppError("Can't record that", "that alert isn't open for you in this index");
    if (a.to === undefined) throw new AppError("Can't record that yet", "this index predates the check; Refresh after the next inbox check");
    if (a.to !== viewPerson) throw new AppError("Can't record that", "that alert isn't addressed to you");
    return true;
  }

  /* Z-0004: before a "Caught up" is written, it must be the tap the screen offered: the index the project was drawn
     from is still the one showing (a tap after a Refresh is refused), and `through` is the newest row it displayed
     under "since you last caught up", the only rows the button sits under (Codex, 20261009-202714). B-1483: and the
     writer is the key's own person (keyPerson given). */
  function checkCheckpoint(idx, projectId, through, shownIdx, viewPerson, keyPerson) {
    if (shownIdx !== undefined && shownIdx !== idx)
      throw new AppError("The page refreshed since you saw this", "tap Caught up again on what's showing now");
    if (viewPerson !== undefined || keyPerson !== undefined) checkWriter(idx, viewPerson, keyPerson);
    const p = ((idx && idx.projects) || []).find((x) => x && x.id === projectId);
    const newest = p && Array.isArray(p.since_rows) && p.since_rows[0] ? p.since_rows[0].number : null;
    if (!p || !/^[BG]-\d{4}$/.test(through || "") || through !== newest)
      throw new AppError("Can't record that", "the checkpoint isn't the newest entry this project showed");
    return true;
  }

  /* Quick-links IS MAP.md (DESIGN.md): its tables as [{section, question, links: [{name, path}]}], repo paths only. */
  function mapLinks(md) {
    const out = [];
    let section = "";
    for (const line of String(md).replace(/\r\n/g, "\n").split("\n")) {
      const h = line.match(/^##\s+(.*)$/);
      if (h) { section = h[1].trim(); continue; }
      const m = line.match(/^\|\s*([^|]+?)\s*\|\s*(.+?)\s*\|\s*$/);
      if (!m || /^-+$/.test(m[1].replace(/[:\s]/g, "")) || /^question$/i.test(m[1])) continue;
      const links = [...m[2].matchAll(/\[([^\]]+)\]\(([^)\s]+)\)/g)]
        .filter((x) => !/^[a-z]+:/i.test(x[2]) && !x[2].includes(".."))
        .map((x) => ({ name: x[1], path: x[2].replace(/^\.\//, "") }));
      if (links.length) out.push({ section, question: m[1], links });
    }
    return out;
  }

  /* Stage 3: a project's next decision, in words, from the index only (make_index.py next_decisions; Codex,
     20261009-200350). Two sources, labelled as what they are: a desk item (associated with the project through the

async function drawLaneMessage(main, ctx) {
  const name = ctx.open.laneMessage;
  const path = `inbox/lanes/zeus/messages/${name}`;
  main.append(backButton(), el("h2", null, A.slugWords(name.replace(/\.md$/, ""))));
  // The chip comes from the index (message.py's strict rule), never from this page's loose field splitter.
  const li = laneIntent(name);
  if (li) main.append(el("div", { class: "state" }, el("span", { class: `kind intent-${li}` }, A.INTENTS[li].word)),
    el("p", { class: "note" }, A.INTENTS[li].means));
  const text = await src.text(A.mustPath(S.person, "lane", path));
  if (ctx.gen !== S.gen) return;
  const m = A.splitMessage(text);
  if (m.fields.length) main.append(el("dl", { class: "fields" }, m.fields.map(([k, v]) => [el("dt", null, k), el("dd", null, v)])));
  main.append(el("div", { class: "body" }, m.body || "(empty)"), el("p", { class: "note" }, el("code", null, path)));
}

async function draw() {
  if (!src) { drawChrome(); drawKeyScreen(); return; }   // not connected: the key screen, whatever was tapped
  const ctx = { gen: ++S.gen, person: S.person, idx: S.idx, open: S.open, tab: S.tab };
  const key = ctx.open ? null : `${ctx.person}/${ctx.tab}`;
  const out = document.createElement("div");           // built off-screen, swapped in only if still current
  try {
    drawChrome();
    if (!ctx.idx) throw S.error || new A.AppError("No snapshot loaded");
    if (ctx.open && ctx.open.compose) out.append(backButton(), canWrite() ? composer(null) : writeNote());
    else if (ctx.open && ctx.open.entry) await drawEntry(out, ctx);
    else if (ctx.open && ctx.open.laneMessage) await drawLaneMessage(out, ctx);
    else if (ctx.open) await drawThread(out, ctx);
    else if (ctx.tab === "today") await drawToday(out, ctx);
    else if (ctx.tab === "ledger") drawLedger(out);
    else if (ctx.tab === "projects") drawProjects(out);
    else if (ctx.tab === "lanes" && ctx.idx.zeus) drawLanes(out);
    else if (ctx.tab === "more") await drawMore(out, ctx);
    else drawInbox(out);
  } catch (e) { out.replaceChildren(errorBox(e)); }
  if (ctx.gen !== S.gen) return;
  const main = $("#main");
  main.replaceChildren(...out.childNodes);
  main.scrollTop = key ? (S.scroll[key] || 0) : 0;
}
function openThread(t) { S.scroll[`${S.person}/${S.tab}`] = $("#main").scrollTop; S.open = t; draw(); }

document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", async () => {
  if (b.dataset.person === S.person) return;
  S.person = b.dataset.person; S.open = null; S.page = 0; S.filter = "all"; S.lpage = 0; S.lfilter = "all"; S.error = null; S.idx = null;
  // Invalidate every pending draw NOW, not when the new index lands, and clear the old person's view at once
  // (Codex, 20261008-100641: a Today read still in flight drew Caleb's page after the switch).
  S.gen++;
  $("#main").replaceChildren(el("p", { class: "note" }, "Loading…"));
  drawChrome();
  try { localStorage.setItem("relay.person", S.person); } catch (e) {}
  if (await loadIndex()) draw();
}));
document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => {
  if (!S.open) S.scroll[`${S.person}/${S.tab}`] = $("#main").scrollTop;
  S.tab = b.dataset.tab; S.open = null; draw();
}));
$("#refresh").addEventListener("click", refresh);
$("#forget").hidden = MODE !== "github";
/* Forget: the key and the source go, anything loading is cancelled, and every pending load or draw is invalidated
   before the screen is cleared, so nothing private can be drawn after it (Codex, 20261009-082346). */
$("#forget").addEventListener("click", () => {
  connGen++;                                       // a connection still being made never completes after this
  if (src && src.close) src.close();
  src = null; S.idx = null; S.error = null; S.open = null; S.scroll = {}; S.loadGen++; S.me = null; S.recorded = {}; S.pending = {};
  S.acked = {}; S.caught = {};
  drawChrome(); drawKeyScreen();
});
(async () => { if (await loadIndex()) draw(); })();
</script>
</body>
